<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyun Merkezi</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(135deg,#1b2430,#2e3b52);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{max-width:760px;width:100%;text-align:center;}
  h1{color:#fff;font-size:32px;margin-bottom:6px;}
  p.sub{color:#b8c2d4;margin-top:0;margin-bottom:30px;}
  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
  .card{
    background:#fff;border-radius:16px;padding:26px;width:100%;max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);text-decoration:none;color:#222;
    display:block;transition:transform .15s;
  }
  .card:hover{transform:translateY(-6px);}
  .card .icon{font-size:56px;margin-bottom:10px;}
  .card h2{margin:6px 0;font-size:22px;}
  .card p{color:#666;font-size:14px;margin:0;}
  .card.molicity h2{color:#c62828;}
  .card.ciftlik h2{color:#2e7d32;}
  .badge{
    display:inline-block;margin-top:12px;padding:6px 16px;border-radius:20px;font-size:13px;
    font-weight:bold;color:#fff;
  }
  .card.molicity .badge{background:#c62828;}
  .card.ciftlik .badge{background:#2e7d32;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎮 Oyun Merkezi</h1>
    <p class="sub">Oynamak istediğin oyunu seç — her oyun bağımsız çalışır, kendi ilerlemesini ayrı ayrı kaydeder.</p>
    <div class="cards">
      <a class="card molicity" href="molicity.html">
        <div class="icon">🏙️</div>
        <h2>MOLİCİTY</h2>
        <p>Dünya Ticaret Oyunu — arsa al, kira topla, en zengin oyuncu ol.</p>
        <span class="badge">2-4 Oyuncu</span>
      </a>
      <a class="card ciftlik" href="ciftlik.html">
        <div class="icon">🚜</div>
        <h2>ÇİFTLİK OYUNU T</h2>
        <p>Ek, büyüt, hasat et, hayvanları besle — kendi çiftliğini kur.</p>
        <span class="badge">Tek Oyuncu</span>
      </a>
    </div>
  </div>
</body>
</html>
